name: Run a Cake build target
description: Restore the pinned build tool and run the same compiled target used locally.
inputs:
  target:
    description: Cake target
    required: true
  suite:
    description: Optional named offline suite
    default: ''
  framework:
    description: Optional framework selector, validated against the suite
    default: ''
  output:
    description: New per-job output directory
    default: artifacts/cake-pilot/ci
runs:
  using: composite
  steps:
  - uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
    with:
      task: existing-cake
    env:
      CAKE_TARGET: ${{ inputs.target }}
      CAKE_SUITE: ${{ inputs.suite }}
      CAKE_FRAMEWORK: ${{ inputs.framework }}
      CAKE_OUTPUT: ${{ inputs.output }}
