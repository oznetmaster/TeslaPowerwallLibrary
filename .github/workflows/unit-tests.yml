name: Unit tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test private credential storage and authorization callbacks without live credentials
        uses: ./.github/actions/cake
        with:
          target: CredentialTools
          suite: credentials
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-tool-tests
          path: |
            artifacts/cake-pilot/ci/test-results/*.trx
            artifacts/cake-pilot/ci/*.json
            artifacts/cake-pilot/ci/*.log
          if-no-files-found: warn
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net10.0]
        suite:
          - name: powerwall
            project: TeslaPowerwallLibrary.Tests/TeslaPowerwallLibrary.Tests.csproj
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        uses: ./.github/actions/cake
        with:
          target: Suite
          suite: ${{ matrix.suite.name }}
          framework: ${{ matrix.framework }}
      - name: Retain unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.suite.name }}-${{ matrix.framework }}
          path: |
            artifacts/cake-pilot/ci/test-results/*.trx
            artifacts/cake-pilot/ci/*.json
            artifacts/cake-pilot/ci/*.log
          if-no-files-found: warn

  companion-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: console-net472
            project: TeslaPowerwallLibrary.TestConsole.Tests/TeslaPowerwallLibrary.TestConsole.Tests.csproj
            framework: net472
          - suite: console-net10
            project: TeslaPowerwallLibrary.TestConsole.Tests/TeslaPowerwallLibrary.TestConsole.Tests.csproj
            framework: net10.0-windows
          - suite: desktop
            project: TeslaPowerwallLibrary.App.Tests/TeslaPowerwallLibrary.App.Tests.csproj
            framework: net10.0-windows
    steps:
      - uses: actions/checkout@v4
      - name: Test companion application offline
        uses: ./.github/actions/cake
        with:
          target: Suite
          suite: ${{ matrix.suite }}
          framework: ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}
          path: |
            artifacts/cake-pilot/ci/test-results/*.trx
            artifacts/cake-pilot/ci/*.json
            artifacts/cake-pilot/ci/*.log

  package-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack and compare public API with the released baseline
        uses: ./.github/actions/cake
        with:
          target: ReleaseArtifacts
      - name: Retain verified local packages and release assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-compatibility
          path: |
            artifacts/cake-pilot/ci/nuget/*.nupkg
            artifacts/cake-pilot/ci/release/*
            artifacts/cake-pilot/ci/*.json
            artifacts/cake-pilot/ci/*.log
          if-no-files-found: warn

  build-tool-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore the pinned build tool
        run: dotnet restore build/Build.csproj --locked-mode
      - name: Test artifact comparison and CI task safeguards
        run: dotnet test build/Tests/Build.Tests.csproj -c Release --logger "trx;LogFileName=build-tests.trx" --results-directory artifacts/cake-build-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-tool-tests
          path: artifacts/cake-build-tests/*.trx
          if-no-files-found: warn
