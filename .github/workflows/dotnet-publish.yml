name: Publish .NET Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string
      skip_hardware_checks:
        description: Reuse recorded manual processor results, or explicitly override unavailable hardware
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Tested source, completion time, result and cleanup evidence, or unavailable-hardware reason
        required: false
        type: string
      skip_desktop_checks:
        description: Reuse recorded desktop tests instead of waiting for another hosted run
        required: false
        type: boolean
        default: false
      desktop_skip_reason:
        description: Tested source, completion time, frameworks, pass counts and evidence (required when selected)
        required: false
        type: string
      validation_commit:
        description: Reuse CI passes within 24h from this ancestor SHA; only release automation/docs may differ
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: write

# All publication entry points in this repository share this lock.
# Keep independent repository releases parallel and retain queued requests.
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: windows-latest
    env:
      PROJECT_PATH: TeslaPowerwallLibrary/TeslaPowerwallLibrary.csproj
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify completed desktop and processor validation
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          hosted-workflows: '["unit-tests.yml"]'
          skip-hardware-checks: ${{ inputs.skip_hardware_checks }}
          hardware-skip-reason: ${{ inputs.hardware_skip_reason }}
          skip-desktop-checks: ${{ inputs.skip_desktop_checks }}
          desktop-skip-reason: ${{ inputs.desktop_skip_reason }}
          validation-commit: ${{ inputs.validation_commit }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        shell: pwsh
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          $rawVersion = switch ($env:GITHUB_EVENT_NAME) {
              'workflow_dispatch' { $env:RELEASE_INPUT_VERSION; break }
              'push' { $env:GITHUB_REF_NAME; break }
              default { '' }
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw 'No release tag or manual version was provided.'
          }

          $packageVersion = $rawVersion.Trim()
          if ($packageVersion.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $packageVersion = $packageVersion.Substring(1)
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z\.-]+)?$') {
              throw "Version '$packageVersion' is not a supported NuGet semantic version."
          }

          "raw_version=$rawVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Reject an already published version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          # Run under the repository publication lock: concurrent tasks must not
          # replace release assets or silently accept somebody else's package.
          $releaseTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing GitHub releases.' }
          if ($releaseTags -ccontains "v$env:RELEASE_VERSION") {
              throw 'This GitHub release already exists; inspect it before retrying publication.'
          }
          $tags = git ls-remote --tags origin "refs/tags/v$env:RELEASE_VERSION" "refs/tags/v$env:RELEASE_VERSION^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the release tag.' }
          if ($tags) {
              $resolved = git rev-parse "v$($env:RELEASE_VERSION)^{commit}"
              if ($LASTEXITCODE -ne 0 -or $resolved -cne $env:GITHUB_SHA) {
                  throw 'The release tag belongs to another source commit.'
              }
          }
          $index = $null
          try {
              $index = Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/teslapowerwalllibrary/index.json'
          } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($index -and @($index.versions | Where-Object { $_ -ieq $env:RELEASE_VERSION }).Count) {
              throw 'This NuGet version already exists; inspect its provenance before retrying publication.'
          }

      - name: Restore solution
        run: dotnet restore TeslaPowerwallLibrary.slnx

      - name: Build solution
        run: dotnet build TeslaPowerwallLibrary.slnx --configuration Release --no-restore -p:GenerateDocfxDocumentation=false -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }}

      # Successful validation was checked above; publishing does not execute the same suites again.
      - name: Pack library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ARTIFACT_DIR }}/nuget" -Force | Out-Null
          dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }} -p:PackageVersion=${{ steps.version.outputs.package_version }} --output "${{ env.ARTIFACT_DIR }}/nuget"

      - name: Publish applications
        shell: pwsh
        run: |
          $apps = @(
              @{ Project = 'TeslaPowerwallLibrary.TestCredentials/TeslaPowerwallLibrary.TestCredentials.csproj'; Name = 'TeslaPowerwallTestCredentials'; Frameworks = @('net10.0-windows') },
              @{ Project = 'TeslaPowerwallLibrary.App/TeslaPowerwallLibrary.App.csproj'; Name = 'TeslaPowerwallApp'; Frameworks = @('net10.0-windows') },
              @{ Project = 'TeslaPowerwallLibrary.Setup/TeslaPowerwallLibrary.Setup.csproj'; Name = 'TeslaPowerwallSetup'; Frameworks = @('net10.0-windows') },
              @{ Project = 'TeslaPowerwallLibrary.TestConsole/TeslaPowerwallLibrary.TestConsole.csproj'; Name = 'TeslaPowerwallTestConsole'; Frameworks = @('net472', 'net10.0-windows') }
          )

          foreach ($app in $apps) {
              foreach ($framework in $app.Frameworks) {
                  $outputDir = "${{ env.ARTIFACT_DIR }}/publish/$($app.Name)-$framework"
                  dotnet publish $app.Project --configuration Release --no-restore -p:GenerateDocfxDocumentation=false --no-build --framework $framework --output $outputDir -p:Version=${{ steps.version.outputs.package_version }}
                  if ($LASTEXITCODE -ne 0) {
                      throw "Publish failed for $($app.Project) ($framework)"
                  }
              }
          }

      - name: Collect release assets
        shell: pwsh
        run: |
          $releaseDir = "${{ env.ARTIFACT_DIR }}/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          foreach ($document in @('README.md', 'CHANGELOG.md', 'LOCAL-ACCESS.md', 'UPGRADING-2.1.md', 'RELEASE-NOTES.md')) {
              Copy-Item $document (Join-Path $releaseDir $document)
          }
          Copy-Item 'TeslaPowerwallLibrary/Tedapi/Protocol/UPSTREAM-LICENSE.txt' (Join-Path $releaseDir 'pypowerwall-LICENSE.txt')

          $libraries = @(
              @{ ProjectDir = 'TeslaPowerwallLibrary'; AssemblyName = 'TeslaPowerwallLibrary'; Frameworks = @('net472', 'net10.0') },
              @{ ProjectDir = 'TeslaPowerwallLibrary.Login'; AssemblyName = 'TeslaPowerwallLibrary.Login'; Frameworks = @('net472', 'net10.0-windows') }
          )

          foreach ($library in $libraries) {
              foreach ($framework in $library.Frameworks) {
                  $outputDir = Join-Path $library.ProjectDir "bin/Release/$framework"
                  foreach ($extension in @('dll', 'xml')) {
                      $sourcePath = Join-Path $outputDir "$($library.AssemblyName).$extension"
                      if (Test-Path $sourcePath) {
                          Copy-Item $sourcePath (Join-Path $releaseDir "$($library.AssemblyName).$framework.$extension") -Force
                      }
                  }
              }
          }

          $publishDir = "${{ env.ARTIFACT_DIR }}/publish"
          if (Test-Path $publishDir) {
              Get-ChildItem -Path $publishDir -Directory | ForEach-Object {
                  $zipPath = Join-Path $releaseDir "$($_.Name).zip"
                  Compress-Archive -Path (Join-Path $_.FullName '*') -DestinationPath $zipPath -Force
              }
          }

      - name: Publish package
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}/nuget" -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if (-not $packages) {
              throw 'No NuGet package was produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json"
              if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $($package.Name)." }
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.package_version }}
          name: v${{ steps.version.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE-NOTES.md
          prerelease: ${{ contains(steps.version.outputs.package_version, '-') }}
          files: |
            ${{ env.ARTIFACT_DIR }}/release/*.dll
            ${{ env.ARTIFACT_DIR }}/release/*.xml
            ${{ env.ARTIFACT_DIR }}/release/*.zip
            ${{ env.ARTIFACT_DIR }}/release/*.md
            ${{ env.ARTIFACT_DIR }}/release/*.txt
